###################################################################################
# Enable a Redis-protocol compatible store as the caching backend for Unbound DNS
# resolver, improving performance by storing DNS query results.
# refer to https://nlnetlabs.nl/documentation/unbound/unbound.conf/#cachedb for more
# details.
###################################################################################
# Requires the dragonfly service to be accessible from unbound, e.g., via
# docker-compose networking.
# Unbound's cachedb module only supports the "redis" backend name, but
# DragonflyDB is wire-protocol compatible with Redis, so it works as a drop-in
# replacement here.
#
# Make sure the 'dragonfly' service is defined in your docker-compose file and
# is on the same network as Unbound (see the cache-backend network).
#
# Example dragonfly service definition:
#
# dragonfly:
#   image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
#   container_name: hygge-dragonfly
#   ulimits:
#     memlock: -1
#   volumes:
#     - dragonfly-data:/data # Named volume to persist DragonflyDB data
#   networks:
#     - cache-backend # Ensure this network matches the one used by Unbound
#
# volumes:
#   dragonfly-data: null # Named volume for DragonflyDB persistence
###################################################################################
server:
  module-config: "validator cachedb iterator" # Enable the cachedb module, along with validator and iterator
cachedb:
  backend: "redis"
  redis-server-host: dragonfly
  redis-server-port: 6379
  redis-expire-records: yes
  # Default is 100ms, which can be too tight across a Docker bridge network,
  # e.g. during Dragonfly snapshot persistence pauses. Silently skipping the
  # cachedb lookup on timeout would defeat the purpose of the second-level cache.
  redis-timeout: 300
  # Explicitly documents that cachedb is consulted before falling back to a
  # serve-expired (stale) reply, matching the serve-expired-client-timeout
  # configured in unbound.conf.
  cachedb-check-when-serve-expired: yes
