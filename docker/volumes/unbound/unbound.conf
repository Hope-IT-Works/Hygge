# https://unbound.docs.nlnetlabs.nl/en/latest/manpages/unbound.conf.html
# https://docs.pi-hole.net/guides/unbound/

server:
    # Enable or disable whether the unbound server forks into the background
    # as a daemon. Default is yes.
    do-daemonize: no # we run in a container, so no daemonizing

    # If given, after binding the port the user privileges are dropped.
    # Default is "unbound" (101:102). If you give username: "" no user change is performed.
    username: "unbound"

    # No need to chroot as this container has been stripped of all other binaries.
    chroot: ""

    # If "" is given, logging goes to stderr, or nowhere once daemonized.
    logfile: ""

    # The process id is written to the file. Not required since we are running
    # in a container with one process.
    pidfile: ""

    # The verbosity number, level 0 means no verbosity, only errors.
    # Level 1 gives operational information.
    # Level 2 gives detailed operational information.
    # Level 3 gives query level information, output per query.
    # Level 4 gives algorithm level information.
    # Level 5 logs client identification for cache misses.
    # Default is level 1. The verbosity can also be increased from the commandline.
    verbosity: 0

    # Specify the interfaces to answer queries from by ip-address.
    # The default is to listen to localhost (127.0.0.1 and ::1).
    # specify 0.0.0.0 and ::0 to bind to all available interfaces.
    # specify every interface[@port] on a new 'interface:' labelled line.
    interface: 0.0.0.0
    port: 5335
    do-ip4: yes
    do-udp: yes
    do-tcp: yes

    # You want to leave this to no unless you have *native* IPv6. With 6to4 and
    # Terredo tunnels your web browser should favor IPv4 for the same reasons
    prefer-ip6: no

    # Disable IPv6 transport entirely. Docker bridge networks typically have
    # no working native IPv6 routing, so attempting IPv6 queries just wastes
    # time waiting for timeouts.
    do-ip6: no

    # Refuse to answer id.server/hostname.bind and version.server/version.bind
    # queries, so the resolver does not reveal its identity or version.
    hide-identity: yes
    hide-version: yes

    # Trust glue only if it is within the server's authority
    harden-glue: yes

    # Require DNSSEC data for trust-anchored zones, if such data is absent, the zone becomes BOGUS
    harden-dnssec-stripped: yes

    # RFC 8020: return NXDOMAIN for queries below a name already known to be
    # NXDOMAIN, instead of asking upstream again.
    harden-below-nxdomain: yes

    # Perform additional queries for infrastructure data to harden the
    # referral path (NS sets and their addresses) against poisoning.
    harden-referral-path: yes

    # Send only the minimum necessary labels of the query name upstream
    # instead of the full name, improving privacy. This is already Unbound's
    # default (yes), set explicitly here so it doesn't silently change with a
    # future version.
    qname-minimisation: yes

    # validation-permissive-mode allows unbound to treat validation failures as non-errors.
    val-permissive-mode: no

    # Don't use Capitalization randomization as it known to cause DNSSEC issues sometimes
    # see https://discourse.pi-hole.net/t/unbound-stubby-or-dnscrypt-proxy/9378 for further details
    use-caps-for-id: no

    # Reduce EDNS reassembly buffer size (see also https://docs.pi-hole.net/guides/dns/unbound/ )
    # IP fragmentation is unreliable on the Internet today, and can cause
    # transmission failures when large DNS messages are sent via UDP. Even
    # when fragmentation does work, it may not be secure; it is theoretically
    # possible to spoof parts of a fragmented DNS message, without easy
    # detection at the receiving end. Recently, there was an excellent study
    # >>> Defragmenting DNS - Determining the optimal maximum UDP response size for DNS <<<
    # by Axel Koolhaas, and Tjeerd Slokker (https://indico.dns-oarc.net/event/36/contributions/776/)
    # in collaboration with NLnet Labs explored DNS using real world data from
    # the RIPE Atlas probes and the researchers suggested different values for
    # IPv4 and IPv6 and in different scenarios. They advise that servers should
    # be configured to limit DNS messages sent over UDP to a size that will not
    # trigger fragmentation on typical network links. DNS servers can switch
    # from UDP to TCP when a DNS response is too big to fit in this limited
    # buffer size. This value has also been suggested in DNS Flag Day 2020.
    edns-buffer-size: 1232

    # Perform prefetching of close to expired message cache entries
    # This only applies to domains that have been frequently queried
    prefetch: yes

    # Fetch DS records earlier (DNSSEC): more cpu usage, less latency
    prefetch-key: yes

    # One thread should be sufficient, can be increased on beefy machines.
    # In reality for most users running on small networks or on a single machine,
    # it should be unnecessary to seek performance enhancement by increasing
    num-threads: 1

    # Ensure kernel buffer is large enough to not lose messages in traffic spikes
    # (requires CAP_NET_ADMIN or privileged)
    so-rcvbuf: 1m

    # Set to 0 to use system default and avoid startup warnings
    so-sndbuf: 0

    # Defensive action against cache poisoning floods: once this many
    # unwanted replies are seen (total, across all threads), the message and
    # rrset caches are cleared to flush out anything malicious. 10 million is
    # the suggested value.
    unwanted-reply-threshold: 10000000

    # Increase cache size to utilize more RAM
    msg-cache-size: 64m
    rrset-cache-size: 128m

    # This attempts to reduce latency by serving the outdated record before
    # updating it instead of the other way around
    # Default: cache-min-ttl: 0
    serve-expired: yes

    # Limit serving of expired responses to configured seconds after expiration. 0 means disabled
    # A suggested value per RFC 8767 is between 86400 (1 day) and 259200 (3 days).
    serve-expired-ttl: 86400

    # Time in milliseconds before replying to the client with expired data
    # A recommended value per RFC 8767 is 1800
    serve-expired-client-timeout: 1800

    # The netblock is given as an IP4 or IP6 address with /size appended for a
    # classless network block. The action can be deny, refuse, allow or allow_snoop.
    access-control: 127.0.0.0/8 allow
    access-control: 192.168.0.0/16 allow
    access-control: 172.16.0.0/12 allow
    access-control: 10.0.0.0/8 allow

    # Ensure privacy of local IP ranges
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10

    # Read the root hints from this file. Default is nothing, using built in
    # hints for the IN class. The file has the format of zone files, with root
    # nameserver names and addresses only. The default may become outdated,
    # when servers change, therefore it is good practice to use a root-hints
    # file. get one from https://www.internic.net/domain/named.root
    root-hints: root.hints # located in /var/unbound/root.hints in the container

    # File with trust anchor for one zone, which is tracked with RFC5011 probes.
    # The probes are several times per month, thus the machine must be online frequently.
    # The initial file can be one with contents as described in trust-anchor-file.
    # The file is written to when the anchor is updated, so the unbound user must
    # have write permission.
    auto-trust-anchor-file: root.key # located in /var/unbound/root.key in the container

    # Number of ports to open. This number of file descriptors can be opened per thread.
    # Must be at least 1. Default depends on compile options. Larger numbers need extra
    # resources from the operating system. For performance a very large value is best,
    # use libevent to make this possible.
    outgoing-range: 8192

    # The number of queries that every thread will service simultaneously. If more queries
    # arrive that need servicing, and no queries can be jostled out (see jostle-timeout),
    # then the queries are dropped. This forces the client to resend after a timeout;
    # allowing the server time to work on the existing queries. Default depends on
    # compile options, 512 or 1024.
    num-queries-per-thread: 4096

    # If null or "", no file is used. Set it to the certificate bun-
    # dle file, for example "/etc/pki/tls/certs/ca-bundle.crt". These
    # certificates are used for authenticating connections made to
    # outside peers. For example auth-zone urls, and also DNS over
    # TLS connections. It is read at start up before permission drop
    # and chroot.
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

    # In order to enable extended statistics as described in
    # https://nlnetlabs.nl/documentation/unbound/unbound.conf/#statistics-cumulative
    # and https://nlnetlabs.nl/documentation/unbound/unbound.conf/#extended-statistics
    # the following settings can be used.
    extended-statistics: yes  # set to yes to enable extended statistics which adds more detailed metrics like query types and response codes
    statistics-interval: 0    # set to 0 to disable periodic logging of statistics to the log file
    statistics-cumulative: no # set to yes if graphing tool needs it

# Allow custom configuration to override the settings above
include-toplevel: /etc/unbound/unbound.conf.d/*.conf
